name: Validate audit toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-render.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark_context.py
  claude-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Explicit opt-in CI tooling installation; no target application code or API calls.
      - run: npm install --global @anthropic-ai/claude-code@2.1.296
      - run: python scripts/claude_smoke.py --output /tmp/claude-smoke.json
