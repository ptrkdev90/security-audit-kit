name: Tag release series
on:
  push:
    branches: [main]
    paths:
      - 'docs/release-series.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-render.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/tag_release_series.py --publish
